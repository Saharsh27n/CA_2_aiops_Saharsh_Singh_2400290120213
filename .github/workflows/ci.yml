name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t delivery-time-api .

      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 delivery-time-api
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/ && break
            sleep 2
          done
          curl -sf http://localhost:8000/
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"Restaurant_latitude":12.9,"Restaurant_longitude":77.6,"Delivery_location_latitude":13.0,"Delivery_location_longitude":77.7,"Order_Date":"25-03-2022","Vehicle_condition":1,"Type_of_order":"Meal","Type_of_vehicle":"motorcycle"}'

      - name: Show container logs on failure
        if: failure()
        run: docker logs api
